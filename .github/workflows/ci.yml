name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Unit tests with coverage
        uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --summary-only

      - name: Install Stellar CLI
        run: |
          curl -sSfL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin stellar
          stellar --version

      - name: Build contract
        run: |
          stellar contract build
          sha256sum target/wasm32v1-none/release/*.wasm
